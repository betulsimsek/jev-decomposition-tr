[project]
name = "jev-decomposition-tr"
version = "0.1.0"
description = "Does splitting a Jev question into atomic questions help, in English and Turkish?"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "tqdm>=4.70.1",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
local-models = [
    "laya==0.3.20",
    "mlx-lm>=0.31.3",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]
